name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relayops
          POSTGRES_PASSWORD: relayops
          POSTGRES_DB: relayops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayops -d relayops_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://relayops:relayops@127.0.0.1:5432/relayops_test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run the Docker Compose demo
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 45
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/console/
          npm run demo
      - name: Stop the stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose logs
            docker compose down
          fi
